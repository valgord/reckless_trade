name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,intelligence]'
      - run: ruff check .
      - run: bash -n scripts/home_doctor.sh scripts/home_stack.sh
      - run: make home-config
      - run: pytest
