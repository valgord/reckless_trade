services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  trader:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    environment:
      TRADING_MODE: ${TRADING_MODE:-demo}
      RUN_NAUTILUS_NODE: ${RUN_NAUTILUS_NODE:-false}
      ENABLE_DEMO_STRATEGY: ${ENABLE_DEMO_STRATEGY:-false}
      ENABLE_CARRY_OBSERVER: ${ENABLE_CARRY_OBSERVER:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
    restart: unless-stopped

  control-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    command: ["uvicorn", "apps.control_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-demo}
      RUN_NAUTILUS_NODE: ${RUN_NAUTILUS_NODE:-false}
      ENABLE_DEMO_STRATEGY: ${ENABLE_DEMO_STRATEGY:-false}
      ENABLE_CARRY_OBSERVER: ${ENABLE_CARRY_OBSERVER:-false}
      NEWS_ENABLED: ${NEWS_ENABLED:-false}
      NEWS_FORWARD_TO_INTELLIGENCE: ${NEWS_FORWARD_TO_INTELLIGENCE:-false}
    ports: ["8000:8000"]
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  carry-monitor:
    profiles: ["carry"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    command: ["python", "-m", "apps.trader.carry_monitor", "--watch", "--poll-seconds", "60"]
    environment:
      TRADING_MODE: demo
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  carry-scanner:
    profiles: ["carry"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["python", "-m", "apps.trader.carry_scanner", "--watch", "--poll-seconds", "300"]
    environment:
      CARRY_SCANNER_REST_URL: ${CARRY_SCANNER_REST_URL:-https://api.bybit.com}
      CARRY_SCANNER_SYMBOLS: ${CARRY_SCANNER_SYMBOLS:-}
      CARRY_SCANNER_MAX_SYMBOLS: ${CARRY_SCANNER_MAX_SYMBOLS:-20}
      CARRY_SCANNER_FUNDING_HISTORY_LIMIT: ${CARRY_SCANNER_FUNDING_HISTORY_LIMIT:-21}
      CARRY_SCANNER_TARGET_NOTIONAL_USDT: ${CARRY_SCANNER_TARGET_NOTIONAL_USDT:-100}
      CARRY_SCANNER_HORIZON_SETTLEMENTS: ${CARRY_SCANNER_HORIZON_SETTLEMENTS:-3}
      CARRY_SCANNER_MIN_TURNOVER_24H_USDT: ${CARRY_SCANNER_MIN_TURNOVER_24H_USDT:-10000000}
      CARRY_SCANNER_MIN_FUNDING_SAMPLES: ${CARRY_SCANNER_MIN_FUNDING_SAMPLES:-6}
      CARRY_SCANNER_MIN_POSITIVE_SHARE: ${CARRY_SCANNER_MIN_POSITIVE_SHARE:-0.6}
      CARRY_SCANNER_HISTORY_DB: ${CARRY_SCANNER_HISTORY_DB:-/app/data/carry/scanner-history.sqlite3}
      CARRY_SCANNER_HISTORY_RETENTION_DAYS: ${CARRY_SCANNER_HISTORY_RETENTION_DAYS:-90}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  carry-alerts:
    profiles: ["carry"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["python", "-m", "apps.trader.carry_alerts", "--watch", "--poll-seconds", "30"]
    environment:
      TRADING_MODE: demo
      CARRY_ALERT_LLM_ENABLED: ${CARRY_ALERT_LLM_ENABLED:-false}
      CARRY_ALERT_STALE_SECONDS: ${CARRY_ALERT_STALE_SECONDS:-180}
      CARRY_ALERT_PROFIT_REVIEW_USDT: ${CARRY_ALERT_PROFIT_REVIEW_USDT:-0.05}
      CARRY_ALERT_MAXIMUM_LOSS_USDT: ${CARRY_ALERT_MAXIMUM_LOSS_USDT:--2}
      CARRY_ALERT_MIN_FUNDING_SETTLEMENTS: ${CARRY_ALERT_MIN_FUNDING_SETTLEMENTS:-3}
      CARRY_ALERT_WEBHOOK_URL: ${CARRY_ALERT_WEBHOOK_URL:-}
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CARRY_SCANNER_STATUS_PATH: ${CARRY_SCANNER_STATUS_PATH:-/app/data/runtime/carry-scanner.json}
      CARRY_SCANNER_ALERT_STATE_PATH: ${CARRY_SCANNER_ALERT_STATE_PATH:-/app/data/runtime/carry-scanner-alert-state.json}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  intelligence:
    profiles: ["intelligence"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["uvicorn", "apps.intelligence.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trading:change-me@postgres:5432/trading}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-market_events}
    ports: ["8010:8010"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  news-worker:
    profiles: ["intelligence", "news"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    command: ["python", "-m", "apps.news_worker.main"]
    environment:
      NEWS_ENABLED: ${NEWS_ENABLED:-false}
      NEWS_RSS_URLS: ${NEWS_RSS_URLS:-}
      NEWS_POLL_SECONDS: ${NEWS_POLL_SECONDS:-60}
      NEWS_SOURCE_MIN_POLL_SECONDS: ${NEWS_SOURCE_MIN_POLL_SECONDS:-60}
      NEWS_STORE_DATABASE: ${NEWS_STORE_DATABASE:-true}
      NEWS_FORWARD_TO_INTELLIGENCE: ${NEWS_FORWARD_TO_INTELLIGENCE:-false}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    profiles: ["intelligence"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.4}
    volumes:
      - ollama_data:/root/.ollama
    ports: ["11434:11434"]
    restart: unless-stopped

  qdrant:
    profiles: ["intelligence"]
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports: ["6333:6333"]
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.1
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
    name: ${OLLAMA_VOLUME_NAME:-reckless_trade_ollama_data}
  qdrant_data:
  prometheus_data:
  grafana_data:
